name: Compilar PSP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - name: Instalar ferramentas
        run: apk add build-base git bash

      - uses: actions/checkout@v4

      - name: Compilar
        run: |
          DIR=$(dirname "$(find . -name Makefile -not -path './.git/*' | head -n1)")
          echo "Makefile encontrado em: $DIR"
          cd "$DIR"
          make

      - uses: actions/upload-artifact@v4
        with:
          name: MotoGame
          path: "**/EBOOT.PBP"
